        58419, 58489, 58558, 58628, 58698, 58767, 58836, 58906, 58976, 59045, 59115, 59184,
        59253, 59323, 59392, 59461, 59531, 59600, 59669, 59739, 59808, 59877, 59946, 60015,
        60084, 60153, 60222, 60291, 60360, 60429, 60499, 60567, 60636, 60705, 60774, 60843,
        60912, 60980, 61049, 61118, 61187, 61255, 61324, 61393, 61461, 61530, 61599, 61667,
        61736, 61804, 61873, 61941, 62010, 62078, 62146, 62215, 62283, 62352, 62420, 62488,
        62556, 62624, 62693, 62761, 62829, 62897, 62965, 63033, 63101, 63169, 63237, 63305,
        63373, 63441, 63509, 63577, 63645, 63713, 63780, 63848, 63916, 63984, 64051, 64119,
        64187, 64254, 64322, 64390, 64457, 64525, 64592, 64660, 64727, 64795, 64862, 64930,
        64997, 65064, 65132, 65199, 65266, 65333, 65401, 65468, 65535,
      };
      // Stock returns +/-666.66 outside these limits; map faults to NaN.
      if (!std::isfinite(coordinate) || coordinate < 3869.0f || coordinate > 65635.0f)
        return NAN;
      if (coordinate > 65535.0f) return 600.0f;
      unsigned index = 0;
      while (index < 799 && coordinate > pgm_read_word(&table[index + 1])) ++index;
      const float low = pgm_read_word(&table[index]);
      const float width = pgm_read_word(&table[index + 1]) - low;
      return (coordinate - low) / width + static_cast<float>(index) - 200.0f;

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

  - platform: debug
    reset_reason:
      name: "Last Reset Reason"
      entity_category: diagnostic

binary_sensor:
  - platform: template
    name: "Measurement Problem"
    device_class: problem
    entity_category: diagnostic
    # Allow initial sampling after boot. Missing readings, ADC faults and
    # recovered table-range faults propagate NaN through the calculation.
    # This does not verify calibration or distinguish probe wiring faults.
    lambda: |-
      if (!id(pt1000_temp).has_state() && millis() < 30000U) {
        return {};
      }
      return !id(pt1000_temp).has_state() ||
             !std::isfinite(id(pt1000_temp).state);

button:
  - platform: restart
    name: "Restart"
    entity_category: config

# Diagnostic acquisition test: match the factory's six-conversion burst using
# native ESPHome actions. Calibration, conversion, and filter count are unchanged.
# Each 64 SPS conversion waits about 17 ms plus I2C overhead; a burst takes
# roughly 0.1-0.15 seconds. ESPHome may log a long-operation warning for this.
interval:
  - interval: 1s
    then:
      - repeat:
          count: 6
          then:
            - component.update: pt1000_raw
