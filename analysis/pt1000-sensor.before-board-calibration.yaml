# DIAGNOSTIC VARIANT for the existing top-tank device.
# Changes acquisition scheduling only; calibration and conversion are unchanged.
esphome:
  name: hot-water-tank-top
  friendly_name: Hot Water Tank Top
esp8266:
  board: esp_wroom_02
  
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 12h
  ap: {}

captive_portal:

web_server:

api:
  # Keep measuring and serving the web UI when Home Assistant is offline.
  reboot_timeout: 0s

ota:
  platform: esphome

logger:

debug:
  update_interval: 60s

improv_serial:

i2c:
  sda: GPIO12
  scl: GPIO14
  scan: true

ads1115:
  - id: ads1115_1
    address: 0x48
    continuous_mode: false

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    entity_category: diagnostic
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

  - platform: debug
    free:
      name: "Free Heap"
      entity_category: diagnostic

  # Factory ADC settings; use native ESPHome polling and averaging.
  - platform: ads1115
    multiplexer: 'A0_GND'
    gain: 6.144
    resolution: 16_BITS
    sample_rate: 64
    ads1115_id: ads1115_1
    name: "PT1000 Raw"
    id: pt1000_raw
    entity_category: diagnostic
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 6
    update_interval: never
    filters:
      # Trigger six consecutive native ADS1115 conversions from the interval
      # below. Publish their average once the sixth reading arrives.
      - sliding_window_moving_average:
          window_size: 6
          send_every: 6
          send_first_at: 6
      - timeout: 30s
    on_value:
      - component.update: pt1000_voltage

  - platform: template
    name: "PT1000 Voltage"
    id: pt1000_voltage
    entity_category: diagnostic
    device_class: voltage
    state_class: measurement
    unit_of_measurement: "V"
    accuracy_decimals: 6
    update_interval: never
    lambda: |-
      return id(pt1000_raw).state;
    on_value:
      - component.update: pt1000_temp

  - platform: template
    name: "PT1000 Temperature"
    id: pt1000_temp
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 2
    update_interval: never
    # Recovered from wj325-backup.bin; see FIRMWARE-ANALYSIS.md.
    # Calibration belongs to the ORIGINAL/BOTTOM unit, not this TOP unit.
    lambda: |-
      constexpr int32_t zero = 1;
      constexpr int32_t full = 28990;
      constexpr float vref = 3.4f;
      constexpr float rzero = 30.0f;

      float voltage = id(pt1000_voltage).state;
      if (!std::isfinite(voltage) || voltage < 0.0f) return NAN;
      if (voltage > vref) voltage = vref;
      const int32_t count = static_cast<int32_t>((voltage / vref) * 32767.0f);
      // Stock returns +/-888.889 for ADC limits. Report unavailable instead.
      if (count <= 99 || count > 32667) return NAN;
      const int32_t normalized = ((count - zero) * 32767) / (full - zero);

      // Manufacturer's nonlinear correction, PT1000 / 600 C range branch.
      // These are scaled table coordinates, not resistance values in ohms.
      constexpr float series = 106539.0f;
      const float zero_coordinate = rzero / 10.0f;
      const float zero_voltage = (vref * zero_coordinate) / (series + zero_coordinate);
      const float full_voltage = (vref * 65535.0f) / (series + 65535.0f);
      const float scale = 32767.0f / (full_voltage - zero_voltage);
      const float corrected_voltage = static_cast<float>(normalized) / scale + zero_voltage;
      const float coordinate = (corrected_voltage * series) / (vref - corrected_voltage);

      // Exact factory table: indices 0..800 correspond to -200..600 C.
      // Keep in flash to avoid spending 1602 bytes of ESP8266 RAM.
      static const uint16_t table[801] PROGMEM = {
        3869, 3959, 4049, 4139, 4229, 4320, 4410, 4499, 4589, 4679, 4768, 4858,
        4947, 5037, 5126, 5215, 5305, 5394, 5483, 5572, 5660, 5749, 5838, 5927,
